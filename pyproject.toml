[project]
dependencies = [
    "verl[gpu,vllm]",
    "flashinfer-python",
    "docker>=7.1.0",
    "aiodocker>=0.24.0",
    "matplotlib>=3.10.1",
    "joblib>=1.4.2",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "math-verify[antlr4-13-2]>=0.3.3",
    "swebench",
    "swesmith",
    "tenacity>=9.1.2",
    "httpx-aiohttp>=0.1.2",
    "blessed>=1.21.0",
    "pyte>=0.8.2",
]
name = "multiturn-rl"
version = "0.1.0"
description = "Multiturn RL experiments"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.sources]
verl = { path = "verl", editable = true }
swebench = { path = "SWE-bench", editable = true }
swesmith = { path = "SWE-smith", editable = true }
flashinfer-python = { index = "flashinfer" }

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/cu124/torch2.6/"

[dependency-groups]
dev = ["pytest>=8.3.5"]

# -------------------------------
# tool.ruff - Linting configuration (coped from veRL linting config)
# -------------------------------
[tool.ruff]
# Note: While the formatter will attempt to format lines such that they remain within the line-length,
# it isn't a hard upper bound, and formatted lines may exceed the line-length.
line-length = 120

[tool.ruff.lint]
isort = { known-first-party = ["verl"] }
# c.f. https://github.com/vllm-project/vllm/blob/ce8d6b75fc0586045df75ee1568a5b5f9957251b/pyproject.toml
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
    "G",
]
ignore = [
    # star imports
    "F405",
    "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # Can remove once 3.10+ is the minimum Python version
    "UP007",
]
